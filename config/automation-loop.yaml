# DramaEditor 15-minute loop — Studio UI/UX 复刻 + TapNow/TapTV
# 流程：Inspect → Review → Debug → Fix → Verify → Commit

automation:
  interval_cron: "*/15 * * * *"
  timezone: Asia/Shanghai
  max_items_per_run: 3
  max_iterations_per_day: 96
  early_exit_if_no_high: true
  branch: automation/hourly-inspection
  repo: kinksid/DramaEditor
  phases:
    - inspect
    - review
    - debug
    - fix
    - verify
    - commit

references:
  studio:
    url: https://studio.dreem-world.ai/
    role: feature_flow_and_ui_ux_replica
    support: https://www.dreem-world.ai/
    notes: |
      Primary: replicate Studio feature flow AND UI/UX (IA, dark charcoal+rose shell,
      canvas workspace, inspector, generation task feedback, node context actions).
  tapnow_canvas:
    url: https://app.tapnow.ai/
    role: ux_workspace_supplement
    notes: left asset dock, drag-to-canvas, select/dblclick
  taptv:
    url: https://app.tapnow.ai/home/taptv
    role: ux_inspire_remix
    notes: local shell only (C4 confirmed)

confirmed_decisions:
  C1: bottom_generation_task_bar_and_node_floating_toolbar
  C2: inspector_full_dark
  C3: worlds_no_forced_sample_project_split
  C4: taptv_local_shell_only

targets:
  cloud_github:
    enabled: true
    role: "Review + Debug + 修复 + 提交到 GitHub"
    sync_to_github: true
    allow_commit: true
    workspace: "Cursor Cloud checkout of kinksid/DramaEditor"

  local_volume:
    enabled: true
    role: "拉取云端结果 + 本机验证/心跳"
    root: /Volumes/YANG/DramaEditor
    sync_from_github: true
    sync_to_github: false
    runner: scripts/runLocalLoop.mjs
    heartbeat: logs/automation_heartbeat.log

feedback:
  primary: reports/studio-gap-latest.json
  archive_glob: reports/studio-gap-*.json
  inspect_reports_glob: reports/[0-9][0-9][0-9][0-9]-*.json
  fix_log: fixes/fix_log.json
  error_glob: errors/error_*.json
  auto_resolve:
    priorities: [high]
    require_verify: true
    include_review_bugs: true
    include_debug_failures: true

drama_editor:
  allowed_globs:
    - "src/**/*.{ts,tsx}"
    - "scripts/**/*.mjs"
    - "src/app/**/*.css"
    - "reports/**/*.json"
    - "fixes/fix_log.json"
    - "logs/**/*"
    - "errors/**/*.json"
    - "config/automation-*.{yaml,md}"
  verify:
    always:
      - npm run typecheck
    when_ui_changed:
      - npm run inspect:hourly
  reference_primary: https://studio.dreem-world.ai/
  reference_ux: https://app.tapnow.ai/home/taptv
  prompt_file: config/automation-prompt.md

rules:
  - 云端：每轮必须对照 Studio「功能 + UI/UX 复刻」；TapNow/TapTV 为辅助 UX
  - 遵守 C1–C4；勿推翻 confirmed_decisions
  - TapTV：仅本地灵感/Remix 壳
  - 无 high/open 且验证通过 → 心跳总结后退出
  - 本机：pull + 验证 + 心跳；默认不 push
  - 门禁文件：reports/studio-gap-latest.json
