# DramaEditor 5-minute loop — Studio 世界详情功能+UI/UX 复刻
# Skills: webapp-testing + skills-zh/diagnose (+ emil-design-eng for UI)
# Primary: https://studio.dreem-world.ai/worlds/019ef8e1-17a3-76d0-b384-6591f50cd2ee
# 流程：Inspect → List → Modify → Debug → Review → Verify → Commit

automation:
  interval_cron: "*/5 * * * *"
  timezone: Asia/Shanghai
  max_items_per_run: 1
  max_iterations_per_day: 288
  early_exit_if_no_high: true
  branch: automation/hourly-inspection
  repo: kinksid/DramaEditor
  phases:
    - inspect
    - list
    - modify
    - debug
    - review
    - verify
    - commit

references:
  studio:
    url: https://studio.dreem-world.ai/worlds/019ef8e1-17a3-76d0-b384-6591f50cd2ee
    role: feature_and_ui_ux_replica
    support: https://www.dreem-world.ai/
    notes: |
      Primary: feature + UI/UX replica for this worlds-level world detail page and its
      subtree (tabs, characters, locations, storylines, related story/canvas).
      Parent /worlds list is context only — not the every-run main target.
  studio_root: https://studio.dreem-world.ai/
  pixel_baseline: reports/studio-pixel-baseline.md
  tapnow_canvas:
    url: https://app.tapnow.ai/
    role: ux_workspace_supplement
  taptv:
    url: https://app.tapnow.ai/home/taptv
    role: ux_inspire_remix
    notes: local shell only (C4 confirmed)

confirmed_decisions:
  C1: bottom_generation_task_bar_and_node_floating_toolbar
  C2: inspector_full_dark
  C3: worlds_no_forced_sample_project_split
  C4: taptv_local_shell_only
  primary_replica: studio_world_019ef8e1_detail_and_subtree

targets:
  cloud_github:
    enabled: true
    role: "Inspect+List+Modify+Debug+Review+Verify+Commit"
    sync_to_github: true
    allow_commit: true
    workspace: "Cursor Cloud checkout of kinksid/DramaEditor"

  local_volume:
    enabled: true
    role: "拉取云端结果 + 本机验证/心跳"
    root: /Volumes/YANG/DramaEditor
    sync_from_github: true
    sync_to_github: false
    runner: scripts/runLocalLoop.mjs
    heartbeat: logs/automation_heartbeat.log

feedback:
  primary: reports/studio-gap-latest.json
  archive_glob: reports/studio-gap-*.json
  inspect_reports_glob: reports/[0-9][0-9][0-9][0-9]-*.json
  fix_log: fixes/fix_log.json
  error_glob: errors/error_*.json
  auto_resolve:
    priorities: [high]
    require_verify: true
    include_review_bugs: true
    include_debug_failures: true

drama_editor:
  allowed_globs:
    - "src/**/*.{ts,tsx}"
    - "scripts/**/*.mjs"
    - "src/app/**/*.css"
    - "reports/**/*.json"
    - "reports/studio-pixel-baseline.md"
    - "fixes/fix_log.json"
    - "logs/**/*"
    - "errors/**/*.json"
    - "config/automation-*.{yaml,md}"
    - "next.config.ts"
    - "tailwind.config.ts"
  verify:
    always:
      - npm run typecheck
      - npm run test:webapp
    when_ui_changed:
      - npm run inspect:hourly
  skills:
    - .cursor/skills/webapp-testing
    - .cursor/skills/skills-zh/skills/engineering/diagnose
    - .cursor/skills/emil-design-eng
  reference_primary: https://studio.dreem-world.ai/worlds/019ef8e1-17a3-76d0-b384-6591f50cd2ee
  prompt_file: config/automation-prompt.md

rules:
  - 每轮必须对照主目标世界页 https://studio.dreem-world.ai/worlds/019ef8e1-17a3-76d0-b384-6591f50cd2ee 及其子层级 + 本地对应路由（能开则开）
  - 功能/像素差写入 gap（area=feature_flow|ui_studio|visual_ia），每轮最多修 1 条 high
  - 先 `npm run test:webapp`；失败按 skills-zh/diagnose 建反馈环再改
  - UI 改动遵守 emil-design-eng + cinema dark 可读对比（禁止白底白字 / accent 白字）
  - 遵守 C1–C4；勿推翻 confirmed_decisions
  - 无 high/open 且验证通过 → 心跳总结后退出
  - 本机：pull + 验证 + 心跳；默认不 push
  - 门禁文件：reports/studio-gap-latest.json / reports/webapp-smoke/latest.json
